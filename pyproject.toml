[project]
name = "ahc061-reinforce"
version = "0.1.0"
description = "AHC061 reinforcement learning pipeline (reinforce.ppo)"
readme = "reinforce/docs/SETUP.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hydra-core>=1.3,<1.4",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "torch>=2.4,<2.7",
    "tqdm>=4.66,<5",
    "pybind11>=2.11,<3",
    "setuptools>=68",
    "ninja>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6,<1",
]
mlflow = [
    "mlflow>=2.11,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["reinforce/tests"]
