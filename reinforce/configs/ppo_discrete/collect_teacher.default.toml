[collect_teacher]
env_id = "CartPole-v1"
episodes = 200
max_steps_per_episode = 1000
seed = 1
output_npz = "reinforce/outputs/teacher_cartpole.npz"
policy = "random"
# AHC061 の BC 教師収集では "ahc061_main_greedy" 推奨
