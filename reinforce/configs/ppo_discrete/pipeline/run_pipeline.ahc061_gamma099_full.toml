[run_pipeline]
env_id = "AHC061Local-v0"
env_kwargs_json = '{"bayes_num_particles":128,"bayes_backend":"cpp","case_select_mode":"sequential","cache_cases":false}'
run_root = "reinforce/outputs/ahc061_gamma099_full"
run_name = ""
resume = false
seed = 1

# collect_teacher (greedy teacher)
collect_episodes = 5000
collect_policy = "ahc061_main_greedy"
collect_workers = 14
collect_vector_env = "sync"
skip_collect = false

# train_bc
bc_epochs = 30
skip_bc = false

# train_ppo
# 12h-class target (machine dependent): about 8,000,000 steps.
ppo_total_timesteps = 8000000
ppo_num_envs = 16
ppo_num_steps = 128
ppo_learning_rate = 0.0001
ppo_learning_rate_schedule = "linear(1.0e-4,0.0)"
ppo_gamma = 0.99
ppo_gae_lambda = 0.95
ppo_num_minibatches = 8
ppo_update_epochs = 3
ppo_norm_adv = true
ppo_clip_coef = 0.15
ppo_clip_vloss = true
ppo_ent_coef = 0.003
ppo_vf_coef = 0.5
ppo_max_grad_norm = 0.5
ppo_target_kl = 0.01
ppo_checkpoint_interval_steps = 500000
ppo_vector_env = "async"
ppo_eval_interval_steps = 200000
ppo_eval_episodes = 1000
ppo_eval_seed_start = 2000000
ppo_eval_fixed_seeds = true
ppo_eval_deterministic = true
ppo_eval_at_start = true
ppo_eval_vector_env = "sync"
ppo_eval_env_kwargs_json = ""
ppo_vecnorm = true
ppo_vecnorm_norm_obs = true
ppo_vecnorm_norm_reward = false
ppo_vecnorm_eval_norm_reward = false
ppo_vecnorm_clip_obs = 10.0
ppo_vecnorm_clip_reward = 10.0
ppo_vecnorm_epsilon = 1e-8
ppo_vecnorm_gamma = 0.99
use_action_mask = true
model_class = ""
model_config_file = "reinforce/configs/ppo_discrete/model/model.ahc061_cnn_full.toml"
model_config_json = ""
skip_ppo = false

# evaluate_policy (periodic val uses this case band too)
skip_last_eval = false
eval_episodes = 1000
eval_env_kwargs_json = ""
eval_casegen_num_cases = 1000
eval_casegen_seed_mode = "sequential"
eval_casegen_seed_start = 2000000
eval_casegen_rng_seed = 1
eval_casegen_unique_random = true
eval_casegen_fixed_m = 0
eval_casegen_fixed_u = 0
eval_casegen_tools_dir = "tools"


# seed bands
# train: [1000000, 1079999], eval: [2000000, 2000999], real: [0, 999]
casegen_enable = true
casegen_num_cases = 80000
casegen_seed_mode = "sequential"
casegen_seed_start = 1000000
casegen_rng_seed = 1
casegen_unique_random = false
casegen_fixed_m = 0
casegen_fixed_u = 0
casegen_tools_dir = "tools"


# tracking
tensorboard = true
mlflow_tracking_uri = ""
mlflow_experiment = "ppo_discrete"
mlflow_run_name = ""
