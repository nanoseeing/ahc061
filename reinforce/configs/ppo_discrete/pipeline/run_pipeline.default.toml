[run_pipeline]
env_id = "AHC061Local-v0"
env_kwargs_json = "{}"
run_root = "reinforce/outputs/pipeline_runs"
run_name = ""
resume = false
seed = 1

# collect_teacher
collect_episodes = 200
collect_policy = "random"
collect_workers = 1
collect_feature_id = "submit_v1"
collect_pf_enabled = true
collect_amp = false
collect_save_aux_targets = false  # saves opp_param_true/opp_valid keys
# collect_policy は random / model_* を使用
skip_collect = false

# train_bc
bc_epochs = 20
bc_aux_opp_param_loss_coef = 0.0
bc_aux_opp_param_use_valid_mask = true
skip_bc = false

# train_ppo
ppo_total_timesteps = 200000
ppo_num_envs = 8
ppo_num_steps = 100
ppo_learning_rate = 0.00025
ppo_learning_rate_schedule = "linear(2.5e-4,0.0)"      # e.g. "constant(2.5e-4)" / "piecewise(0:3e-4,1:1e-5)"
ppo_gamma = 0.99
ppo_gae_lambda = 0.95
ppo_num_minibatches = 4
ppo_update_epochs = 4
ppo_norm_adv = true
ppo_clip_coef = 0.2
ppo_clip_coef_schedule = "constant" # constant|linear|cosine
ppo_clip_coef_final = 0.2           # used when schedule != constant
ppo_clip_coef_schedule_expr = ""    # optional; overrides ppo_clip_coef_schedule/final
ppo_clip_range_vf = 0.2             # optional; if omitted, value clipping is disabled (SB3-like)
ppo_clip_range_vf_schedule = "constant" # constant|linear|cosine
ppo_clip_range_vf_final = 0.2           # used when schedule != constant
ppo_clip_range_vf_schedule_expr = ""    # optional; overrides ppo_clip_range_vf_schedule/final
ppo_clip_vloss = true
ppo_ent_coef = 0.01
ppo_ent_coef_schedule = "constant"  # constant|linear|cosine
ppo_ent_coef_final = 0.01           # used when schedule != constant
ppo_ent_coef_schedule_expr = ""     # optional; overrides ppo_ent_coef_schedule/final
ppo_vf_coef = 0.5
ppo_aux_opp_param_loss_coef = 0.0
ppo_aux_opp_param_use_valid_mask = true
ppo_max_grad_norm = 0.5
ppo_target_kl = 0.01
ppo_checkpoint_interval_steps = 0
ppo_feature_id = "submit_v1"
ppo_pf_enabled = true
ppo_amp = false
ppo_memory_format = "auto"
ppo_pin_memory = true
ppo_rollout_cache_device = "auto"
ppo_distributed = "auto"
ppo_model_preset = ""     # e.g. "student_m_submit_v1"
ppo_eval_interval_steps = 0
ppo_eval_episodes = 100
ppo_eval_seed_start = 2000000
ppo_eval_fixed_seeds = true
ppo_eval_deterministic = true
ppo_eval_at_start = true
ppo_eval_env_kwargs_json = ""     # if empty, training env_kwargs are reused
ppo_vecnorm = false
ppo_vecnorm_norm_obs = true
ppo_vecnorm_norm_reward = false
ppo_vecnorm_eval_norm_reward = false
ppo_vecnorm_clip_obs = 10.0
ppo_vecnorm_clip_reward = 10.0
ppo_vecnorm_epsilon = 1e-8
ppo_vecnorm_gamma = 0.99
ppo_log_interval_iters = 1
use_action_mask = false
model_class = ""                  # e.g. "DiscreteBoardAgent" or "pkg.mod:Class"
model_config_file = ""            # use model dict (type + kwargs)
model_config_json = ""            # JSON object; deep-merged over model_config_file
ppo_init_model = ""               # optional: train_ppo --init-model path (overrides bc_init.pt)
skip_ppo = false

# evaluate_policy / periodic val seed band
eval_episodes = 50
eval_env_kwargs_json = ""             # if empty, train env_kwargs is reused
skip_last_eval = false


# tracking
tensorboard = true
mlflow_tracking_uri = ""
mlflow_experiment = "ppo_discrete"
mlflow_run_name = ""
