[run_pipeline]
env_id = "AHC061Local-v0"
env_kwargs_json = '{"bayes_num_particles":64,"bayes_backend":"cpp","case_select_mode":"sequential","cache_cases":false}'
run_root = "reinforce/outputs/ahc061_gamma01_light"
run_name = ""
resume = false
seed = 1

# collect_teacher (quick test)
collect_episodes = 400
collect_policy = "ahc061_main_greedy"
collect_workers = 8
collect_vector_env = "sync"
skip_collect = false

# train_bc
bc_epochs = 6
skip_bc = false

# train_ppo (few-minutes target)
ppo_total_timesteps = 20000
ppo_num_envs = 8
ppo_num_steps = 64
ppo_learning_rate = 0.00015
ppo_learning_rate_schedule = "linear(1.5e-4,0.0)"
ppo_gamma = 0.1
ppo_gae_lambda = 0.95
ppo_num_minibatches = 4
ppo_update_epochs = 2
ppo_norm_adv = true
ppo_clip_coef = 0.2
ppo_clip_vloss = true
ppo_ent_coef = 0.003
ppo_vf_coef = 0.5
ppo_max_grad_norm = 0.5
ppo_target_kl = 0.015
ppo_checkpoint_interval_steps = 10000
ppo_vector_env = "async"
ppo_eval_interval_steps = 10000
ppo_eval_episodes = 20
ppo_eval_seed_start = 2000000
ppo_eval_fixed_seeds = true
ppo_eval_deterministic = true
ppo_eval_at_start = true
ppo_eval_vector_env = "sync"
ppo_eval_env_kwargs_json = ""
ppo_vecnorm = true
ppo_vecnorm_norm_obs = true
ppo_vecnorm_norm_reward = false
ppo_vecnorm_eval_norm_reward = false
ppo_vecnorm_clip_obs = 10.0
ppo_vecnorm_clip_reward = 10.0
ppo_vecnorm_epsilon = 1e-8
ppo_vecnorm_gamma = 0.1
use_action_mask = true
model_class = ""
model_config_file = "reinforce/configs/ppo_discrete/model/model.ahc061_cnn_full.toml"
model_config_json = ""
skip_ppo = false

# evaluate_policy
skip_last_eval = false
eval_episodes = 30
eval_env_kwargs_json = ""
eval_casegen_num_cases = 300
eval_casegen_seed_mode = "sequential"
eval_casegen_seed_start = 2000000
eval_casegen_rng_seed = 1
eval_casegen_unique_random = true
eval_casegen_fixed_m = 0
eval_casegen_fixed_u = 0
eval_casegen_tools_dir = "tools"


# seed bands
casegen_enable = true
casegen_num_cases = 2000
casegen_seed_mode = "sequential"
casegen_seed_start = 1000000
casegen_rng_seed = 1
casegen_unique_random = false
casegen_fixed_m = 0
casegen_fixed_u = 0
casegen_tools_dir = "tools"


# tracking
tensorboard = true
mlflow_tracking_uri = ""
mlflow_experiment = "ppo_discrete"
mlflow_run_name = ""
