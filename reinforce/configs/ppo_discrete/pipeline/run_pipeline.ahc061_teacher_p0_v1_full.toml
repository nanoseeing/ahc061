[run_pipeline]
env_id = "AHC061Local-v0"
env_kwargs_json = '{"bayes_num_particles":128,"bayes_backend":"cpp","obs_mode":"teacher_p0_v1_88ch","case_select_mode":"sequential","cache_cases":false}'
run_root = "reinforce/outputs/ahc061_teacher_p0_v1_full"
run_name = "teacher_p0_v1_full_seed1"
resume = false
seed = 1

# collect_teacher (full)
collect_episodes = 6000
collect_policy = "random"
collect_workers = 8
collect_chunk_episodes = 10
skip_collect = false

# train_bc
bc_epochs = 30
bc_use_collect_shards = true
skip_bc = false

# train_ppo
ppo_total_timesteps = 48000000
ppo_num_envs = 32
ppo_num_steps = 64
ppo_learning_rate = 0.00010
ppo_learning_rate_schedule = "linear(1.0e-4,2.5e-5)"
ppo_gamma = 1.0
ppo_gae_lambda = 0.98
ppo_num_minibatches = 16
ppo_update_epochs = 4
ppo_norm_adv = true
ppo_clip_coef = 0.12
ppo_clip_coef_schedule = "linear"
ppo_clip_coef_final = 0.07
ppo_clip_coef_schedule_expr = ""
ppo_clip_range_vf = 0.15
ppo_clip_range_vf_schedule = "linear"
ppo_clip_range_vf_final = 0.08
ppo_clip_range_vf_schedule_expr = ""
ppo_clip_vloss = true
ppo_ent_coef = 0.010
ppo_ent_coef_schedule = "linear"
ppo_ent_coef_final = 0.002
ppo_ent_coef_schedule_expr = ""
ppo_vf_coef = 0.5
ppo_max_grad_norm = 0.5
ppo_target_kl = 0.012
ppo_checkpoint_interval_steps = 1000000
ppo_eval_interval_steps = 2000000
ppo_eval_episodes = 1000
ppo_eval_seed_start = 2000000
ppo_eval_fixed_seeds = true
ppo_eval_deterministic = true
ppo_eval_at_start = true
ppo_eval_env_kwargs_json = ""
ppo_vecnorm = true
ppo_vecnorm_norm_obs = true
ppo_vecnorm_norm_reward = false
ppo_vecnorm_eval_norm_reward = false
ppo_vecnorm_clip_obs = 10.0
ppo_vecnorm_clip_reward = 10.0
ppo_vecnorm_epsilon = 1e-8
ppo_vecnorm_gamma = 1.0
ppo_log_interval_iters = 20
use_action_mask = true
model_class = ""
model_config_file = "reinforce/configs/ppo_discrete/model/model.ahc061_teacher_p0_v1.toml"
model_config_json = ""
ppo_init_model = ""
skip_ppo = false

# evaluate_policy (final)
skip_last_eval = false
eval_episodes = 1000
eval_env_kwargs_json = ""


# seed bands


# tracking
tensorboard = true
mlflow_tracking_uri = "sqlite:///reinforce/outputs/mlflow.db"
mlflow_experiment = "ahc061_ppo"
mlflow_run_name = "teacher_p0_v1_full"
