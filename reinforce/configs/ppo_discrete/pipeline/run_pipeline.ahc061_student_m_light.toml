[run_pipeline]
env_id = "AHC061Local-v0"
env_kwargs_json = '{"bayes_num_particles":128,"bayes_backend":"cpp","case_select_mode":"sequential","cache_cases":false}'
run_root = "reinforce/outputs/ahc061_student_m_light"
run_name = ""
resume = false
seed = 1

# collect_teacher (Student-M light)
collect_episodes = 1500
collect_policy = "random"
collect_workers = 8
skip_collect = false

# train_bc
bc_epochs = 12
skip_bc = false

# train_ppo
# ~30min target (machine dependent): about 1,200,000 steps.
ppo_total_timesteps = 1200000
ppo_num_envs = 8
ppo_num_steps = 64
ppo_learning_rate = 0.00015
ppo_learning_rate_schedule = "linear(1.5e-4,0.0)"
ppo_gamma = 0.1
ppo_gae_lambda = 0.95
ppo_num_minibatches = 8
ppo_update_epochs = 3
ppo_norm_adv = true
ppo_clip_coef = 0.2
ppo_clip_vloss = true
ppo_ent_coef = 0.003
ppo_vf_coef = 0.5
ppo_max_grad_norm = 0.5
ppo_target_kl = 0.01
ppo_checkpoint_interval_steps = 200000
ppo_eval_interval_steps = 200000
ppo_eval_episodes = 100
ppo_eval_seed_start = 2000000
ppo_eval_fixed_seeds = true
ppo_eval_deterministic = true
ppo_eval_at_start = true
ppo_eval_env_kwargs_json = ""
ppo_vecnorm = true
ppo_vecnorm_norm_obs = true
ppo_vecnorm_norm_reward = false
ppo_vecnorm_eval_norm_reward = false
ppo_vecnorm_clip_obs = 10.0
ppo_vecnorm_clip_reward = 10.0
ppo_vecnorm_epsilon = 1e-8
ppo_vecnorm_gamma = 0.1
ppo_log_interval_iters = 10
use_action_mask = true
model_class = ""
model_config_file = "reinforce/configs/ppo_discrete/model/model.ahc061_student_m.toml"
model_config_json = ""
skip_ppo = false

# evaluate_policy
skip_last_eval = false
eval_episodes = 100
eval_env_kwargs_json = ""


# seed bands
# train: [1000000, 1011999], eval: [2000000, 2000999]


# tracking
tensorboard = true
mlflow_tracking_uri = ""
mlflow_experiment = "ppo_discrete"
mlflow_run_name = ""
