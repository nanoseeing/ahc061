[model]
type = "StudentMBoardAgent"

[model.kwargs]
# submit_v1 obs: board(46x10x10), no extra global tail
board_channels = 46
board_size = 10
global_dim = 0

# Student-M compact trunk
width = 48
num_blocks = 2
global_hidden_dim = 64
value_hidden_dims = [64]
activation = "tanh"

# Global-conditioned modulation
use_global_film = true
use_global_policy_bias = true
